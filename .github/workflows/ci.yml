name: NextAction Continuous Integration

on:
  push:
    branches: [ master, main, 'release/**', 'feature/**' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. Backend Verification Job
  # ===========================================================================
  backend-ci:
    name: Backend Lint, Test & Migration Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextaction_test
          POSTGRES_USER: nextaction
          POSTGRES_PASSWORD: test_password_secure_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python Syntax & Compilation Verification
        run: |
          python -m compileall backend/app backend/tests

      - name: Database Migration Schema & Single-Head Validation
        env:
          DATABASE_URL: postgresql+psycopg://nextaction:test_password_secure_123@localhost:5432/nextaction_test
        run: |
          cd backend
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic current

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://nextaction:test_password_secure_123@localhost:5432/nextaction_test
          JWT_SECRET_KEY: test_secret_key_minimum_thirty_two_characters_long_ci
          RATE_LIMIT_ENABLED: "false"
        run: |
          cd backend
          pytest -v --durations=10

  # ===========================================================================
  # 2. Flutter Web Verification Job
  # ===========================================================================
  flutter-ci:
    name: Flutter Analyze, Test & Production Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile_web
          flutter pub get

      - name: Run Flutter Static Analyzer
        run: |
          cd apps/mobile_web
          flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Test Suite
        run: |
          cd apps/mobile_web
          flutter test --coverage

      - name: Build Flutter Web Production Release
        run: |
          cd apps/mobile_web
          flutter build web --release --dart-define=API_BASE_URL=https://nextaction-backend.onrender.com
          mkdir -p build/web/downloads
          cp web/download.html build/web/download.html
          cp web/_redirects build/web/_redirects
          cp web/_headers build/web/_headers

      - name: Archive Flutter Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextaction-web-release
          path: apps/mobile_web/build/web/
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/pages-action@v1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: nextaction
          directory: apps/mobile_web/build/web
        continue-on-error: true

  # ===========================================================================
  # 3. Android APK & App Bundle Build Job
  # ===========================================================================
  android-ci:
    name: Android Release APK & AAB Compilation
    runs-on: ubuntu-latest
    needs: [backend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/mobile_web
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd apps/mobile_web
          flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: |
          cd apps/mobile_web
          flutter build appbundle --release

      - name: Archive Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextaction-android-apk
          path: apps/mobile_web/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Archive Android App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextaction-android-aab
          path: apps/mobile_web/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ===========================================================================
  # 4. Optional Shorebird Code-Push Release Job (Runs only if token provided)
  # ===========================================================================
  shorebird-ota:
    name: Shorebird OTA Code-Push Pipeline
    runs-on: ubuntu-latest
    needs: [android-ci]
    if: false # Disabled by default until SHOREBIRD_TOKEN secret is configured by repository owner

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Shorebird
        uses: shorebirdtech/actions/setup-shorebird@v1

      - name: Shorebird Doctor
        run: |
          cd apps/mobile_web
          shorebird doctor

      - name: Shorebird Release or Patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          cd apps/mobile_web
          # To create base release: shorebird release android --no-confirm
          # To release OTA patch:   shorebird patch android --no-confirm
          echo "Shorebird release pipeline ready for authenticated execution."

  # ===========================================================================
  # 5. Docker Production Image & Configuration Validation Job
  # ===========================================================================
  docker-ci:
    name: Production Docker Build & Compose Config Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, flutter-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Production Syntax
        env:
          POSTGRES_PASSWORD: dummy_ci_postgres_password_123
          JWT_SECRET_KEY: dummy_ci_jwt_secret_key_minimum_32_chars
          CORS_ORIGINS: '["https://app.nextaction.com"]'
          TRUSTED_HOSTS: '["app.nextaction.com","api.nextaction.com"]'
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: nextaction-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
