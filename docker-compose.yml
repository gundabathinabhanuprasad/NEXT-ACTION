services:
  postgres:
    image: postgres:16-alpine
    container_name: nextaction_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextaction
      POSTGRES_USER: nextaction
      POSTGRES_PASSWORD: nextaction_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextaction -d nextaction"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: nextaction_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: nextaction_postgres_data
