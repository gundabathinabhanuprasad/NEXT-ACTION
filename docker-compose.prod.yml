# =============================================================================
# NextAction Production Deployment Docker Compose Architecture
# =============================================================================
# - Complete service isolation via private network (no direct DB/Redis host ports)
# - Reverse proxy terminates HTTPS and proxies to internal FastAPI application
# - PostgreSQL with configurable connection pooling and persistent volume
# - Redis distributed rate limiter with authentication and AOF persistence
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Primary Relational Database (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nextaction_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextaction}
      POSTGRES_USER: ${POSTGRES_USER:-nextaction_admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?FATAL: POSTGRES_PASSWORD must be configured in environment}"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 2. Distributed Cache & Rate Limiting Backend (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nextaction_prod_redis
    restart: always
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_prod_data:/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Application Core Service (FastAPI / Uvicorn Multi-Worker)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextaction_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DOCS_ENABLED: "false"
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nextaction_admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?FATAL: POSTGRES_PASSWORD required}"
      POSTGRES_DB: ${POSTGRES_DB:-nextaction}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_SSLMODE: ${DB_SSLMODE:-}
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?FATAL: JWT_SECRET_KEY required}"
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: "${CORS_ORIGINS:?FATAL: CORS_ORIGINS required}"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:?FATAL: TRUSTED_HOSTS required}"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_BACKEND: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TIMEOUT_SECONDS: 2.0
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 4. HTTPS Edge Reverse Proxy & Static Host (Nginx Alpine)
  # ---------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: nextaction_prod_proxy
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./apps/mobile_web/build/web:/usr/share/nginx/html:ro
      - certbot_acme:/var/www/certbot:ro
    networks:
      - internal_network
      - public_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

# =============================================================================
# Networks & Persistent Volumes
# =============================================================================
networks:
  internal_network:
    name: nextaction_internal
    internal: true
  public_network:
    name: nextaction_public
    driver: bridge

volumes:
  postgres_prod_data:
    name: nextaction_prod_postgres_data
  redis_prod_data:
    name: nextaction_prod_redis_data
  certbot_acme:
    name: nextaction_certbot_acme
