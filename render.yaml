# =============================================================================
# NextAction Render Infrastructure Blueprint (render.yaml)
# =============================================================================
# Provides genuine ₹0/month zero-cost backend deployment on Render Free Tier.
# Automatically sets up web service, health checks, environment variables,
# and secret scaffolding without requiring paid add-ons.
# =============================================================================

services:
  - type: web
    name: nextaction-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DOCS_ENABLED
        value: "false"

      # Port and Host binding
      - key: HOST
        value: "0.0.0.0"

      # Persistence Engine: 'mongodb' for ₹0/month MongoDB Atlas M0 cluster
      - key: PERSISTENCE_ENGINE
        value: mongodb
      - key: MONGODB_ENABLED
        value: "true"
      - key: MONGODB_DATABASE
        value: nextaction
      # Provide MongoDB Atlas M0 connection string in Render Dashboard secrets:
      # e.g. mongodb+srv://<username>:<password>@<cluster>.mongodb.net/nextaction?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false

      # High-entropy JWT Secret Key (Render automatically generates a secure 256-bit string)
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: GOOGLE_CLIENT_ID
        value: 961913451597-ft3u2q5vo79m5tv6i58ia69o89p5nm34.apps.googleusercontent.com

      # Rate Limiting Guardrails
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_BACKEND
        value: memory
      - key: RATE_LIMIT_MAX_ATTEMPTS
        value: "300"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      # Optional: To use Upstash Redis free tier, set RATE_LIMIT_BACKEND=redis and supply REDIS_URL in dashboard:
      # - key: REDIS_URL
      #   sync: false

      # CORS & Host Whitelist (Supports canonical Cloudflare Pages domain, active deployment, and Render host)
      - key: CORS_ORIGINS
        value: '["https://nextaction.pages.dev","https://7b06c20e.nextaction.pages.dev"]'
      - key: TRUSTED_HOSTS
        value: '["nextaction-backend.onrender.com","*.onrender.com","localhost","127.0.0.1"]'
      - key: FRONTEND_URL
        value: https://nextaction.pages.dev
      - key: API_BASE_URL
        value: https://nextaction-backend.onrender.com
